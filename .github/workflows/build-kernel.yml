name: Build NanoPi R2C kernel (linux-nanopi-r2c-minimal)

on:
  workflow_dispatch:
    inputs:
      pkgver:
        description: Kernel pkgver (e.g. 7.1.1)
        type: string
        default: ''
      pkgrel:
        description: Package pkgrel
        type: string
        default: '1'

concurrency:
  group: build-kernel
  cancel-in-progress: false

defaults:
 run:
    shell: bash

env:
  TZ: Asia/Shanghai

jobs:
  build:
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_title: ${{ steps.release.outputs.release_title }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          # makepkg checks PKGBUILD depends/makedepends on the build host (even without -s).
          pacman -S --noconfirm --needed \
            base-devel \
            coreutils kmod mkinitcpio \
            aarch64-linux-gnu-gcc aarch64-linux-gnu-binutils \
            bc dtc python \
            git curl xz \
            openssl libelf \
            gnupg ccache pahole

      - name: Fetch ALARM metadata
        run: ./scripts/fetch-alarm-sources.sh

      - name: Resolve version
        id: ver
        env:
          REQUESTED_PKGVER: ${{ inputs.pkgver }}
          REQUESTED_PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail

          # shellcheck source=/dev/null
          source "$GITHUB_WORKSPACE/build/alarm-version.env"

          if [ -n "$REQUESTED_PKGVER" ]; then
            pv="$REQUESTED_PKGVER"
            pr="$REQUESTED_PKGREL"
            [[ "$pv" =~ ^[0-9]+\.[0-9]+([.][0-9]+)*([.]+[-]?[0-9A-Za-z]+)*$ ]] || {
              echo "Error: invalid pkgver: $pv" >&2
              exit 1
            }
            [[ "$pr" =~ ^[1-9][0-9]*$ ]] || {
              echo "Error: invalid pkgrel: $pr" >&2
              exit 1
            }

            IFS=. read -r _major _minor _rest <<< "$pv"
            pkgver="$pv"
            pkgrel="$pr"
            _srcname="linux-${_major}.${_minor}"

            {
              printf 'alarm_repo=%q\n' "$alarm_repo"
              printf 'alarm_commit=%q\n' "$alarm_commit"
              printf 'pkgver=%q\n' "$pkgver"
              printf 'pkgrel=%q\n' "$pkgrel"
              printf '_srcname=%q\n' "$_srcname"
            } > build/alarm-version.env
          fi

          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$pkgrel" >> "$GITHUB_OUTPUT"
          echo "series=${_srcname#linux-}" >> "$GITHUB_OUTPUT"

      - name: Resolve release names
        id: release
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            tag="linux-nanopi-r2c-minimal-${{ steps.ver.outputs.pkgver }}-${{ steps.ver.outputs.pkgrel }}"
            title="$tag"
            prerelease=false
          else
            safe_ref="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
            tag="test-${safe_ref}-${GITHUB_RUN_NUMBER}"
            title="Test build ${safe_ref} #${GITHUB_RUN_NUMBER}"
            prerelease=true
          fi
          {
            echo "artifact_name=linux-nanopi-r2c-minimal-${{ steps.ver.outputs.pkgver }}-${{ steps.ver.outputs.pkgrel }}"
            echo "release_tag=$tag"
            echo "release_title=$title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Cache kernel sources
        uses: actions/cache@v6
        with:
          path: |
            build/linux-${{ steps.ver.outputs.series }}.tar.xz
            build/patch-${{ steps.ver.outputs.pkgver }}.xz
          key: kernel-src-linux-${{ steps.ver.outputs.series }}-${{ steps.ver.outputs.pkgver }}
          restore-keys: |
            kernel-src-linux-${{ steps.ver.outputs.series }}-

      - name: Cache compiler artifacts (ccache)
        uses: actions/cache@v6
        with:
          path: /github/home/.ccache
          key: ccache-aarch64-minimal-linux-${{ steps.ver.outputs.series }}-${{ steps.ver.outputs.pkgver }}-${{ hashFiles('build/alarm.config', 'config/fragment.*', 'packaging/PKGBUILD', 'packaging/*.patch', 'scripts/merge-config.sh', 'scripts/prepare-build-dir.sh') }}
          restore-keys: |
            ccache-aarch64-minimal-linux-${{ steps.ver.outputs.series }}-${{ steps.ver.outputs.pkgver }}-
            ccache-aarch64-minimal-linux-${{ steps.ver.outputs.series }}-

      - name: Configure ccache
        run: |
          mkdir -p /github/home/.ccache /github/home/.ccache-wrappers
          ln -sf /usr/bin/ccache /github/home/.ccache-wrappers/aarch64-linux-gnu-gcc

      - name: Prepare signing key
        env:
          NANOPI_R2C_KERNEL_PACMAN_KEY: ${{ secrets.NANOPI_R2C_KERNEL_PACMAN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NANOPI_R2C_KERNEL_PACMAN_KEY:-}" ]; then
            echo "Error: NANOPI_R2C_KERNEL_PACMAN_KEY secret is required for public release builds." >&2
            exit 1
          fi

          mkdir -p keys
          echo "$NANOPI_R2C_KERNEL_PACMAN_KEY" | base64 -d > keys/signing.key
          chmod 600 keys/signing.key
          gpg --import keys/signing.key
          KEY_ID=$(gpg --with-colons --list-secret-keys | awk -F: '/^sec:/ {print $5; exit}')
          echo "PACMAN_KEY_PATH=$GITHUB_WORKSPACE/keys/signing.key" >> "$GITHUB_ENV"
          echo "PACMAN_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          gpg --export -a "$KEY_ID" > keys/nanopi-r2c-kernel-arch.pub

      - name: Create build user
        run: |
          useradd -m builduser
          chown -R builduser:builduser "$GITHUB_WORKSPACE" /github/home/.ccache

      - name: Build package
        run: |
          set -euo pipefail

          su builduser -c '
            set -euo pipefail
            export SKIP_ALARM_FETCH=1
            export CCACHE_DIR=/github/home/.ccache
            export CCACHE_COMPILERCHECK=content
            export CCACHE_MAXSIZE=2G
            export PATH=/github/home/.ccache-wrappers:/usr/lib/ccache/bin:$PATH

            ccache -z || true
            ./scripts/build-package.sh
            (cd build && CARCH=aarch64 makepkg --allsource --force --nosign)
            ccache -s || true
          '

      - name: Write source metadata
        run: |
          RELEASE_TAG="${{ steps.release.outputs.release_tag }}" \
            ./scripts/write-source-info.sh

      - name: Prepare release files
        run: |
          set -euo pipefail
          ./scripts/publish-repo.sh
          cp build/SOURCE_INFO.txt repo/aarch64/
          cp build/config.merged repo/aarch64/config.merged
          mkdir -p repo/aarch64/LICENSES
          cp LICENSES/*.txt repo/aarch64/LICENSES/
          (
            cd repo/aarch64
            sha256sum linux-nanopi-r2c-minimal-*.pkg.tar.zst \
              SOURCE_INFO.txt config.merged LICENSES/*.txt > SHA256SUMS
          )
          sha256sum build/linux-nanopi-r2c-minimal-*.pkg.tar.zst \
            build/linux-nanopi-r2c-minimal-*.pkg.tar.zst.sig \
            build/linux-nanopi-r2c-minimal-*.src.tar.gz \
            build/SOURCE_INFO.txt build/config.merged LICENSES/*.txt \
            > build/SHA256SUMS
          [ ! -f keys/nanopi-r2c-kernel-arch.pub ] || cp keys/nanopi-r2c-kernel-arch.pub repo/aarch64/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            build/linux-nanopi-r2c-minimal-*.pkg.tar.zst
            build/linux-nanopi-r2c-minimal-*.pkg.tar.zst.sig
            build/linux-nanopi-r2c-minimal-*.src.tar.gz
            build/SHA256SUMS
            build/SOURCE_INFO.txt
            build/config.merged
            LICENSES/*.txt
            repo/aarch64/
            keys/nanopi-r2c-kernel-arch.pub

      - name: Upload pacman repo for GitHub Pages
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./repo

  deploy_pages:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy pacman repo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish_release:
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (github.ref_name != github.event.repository.default_branch ||
      needs.deploy_pages.result == 'success')
    needs:
      - build
      - deploy_pages
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.release_tag }}"
          title="${{ needs.build.outputs.release_title }}"
          repo="${GITHUB_REPOSITORY:?}"
          sha="${GITHUB_SHA:?}"
          assets=(
            build/linux-nanopi-r2c-minimal-*.pkg.tar.zst
            build/linux-nanopi-r2c-minimal-*.pkg.tar.zst.sig
            build/linux-nanopi-r2c-minimal-*.src.tar.gz
            build/SHA256SUMS
            build/SOURCE_INFO.txt
            build/config.merged
            LICENSES/*.txt
            keys/nanopi-r2c-kernel-arch.pub
          )
          for asset in "${assets[@]}"; do
            [ -f "$asset" ] || {
              echo "Error: missing release asset: $asset" >&2
              exit 1
            }
          done
          release_flags=()
          if [ "${{ needs.build.outputs.prerelease }}" = true ]; then
            release_flags+=(--prerelease)
            notes="Unofficial NanoPi R2C minimal kernel ${tag} validation build. This branch build does not deploy the pacman repository. Source package and merged config are included."
          else
            notes="Unofficial NanoPi R2C minimal kernel ${tag}. Pacman repo: https://therealcoder1337.github.io/nanopi-r2c-kernel-arch/aarch64. Source package and merged config are included."
          fi

          if gh release view --repo "$repo" "$tag" >/dev/null 2>&1; then
            gh release upload --repo "$repo" "$tag" \
              "${assets[@]}" \
              --clobber
            gh release edit --repo "$repo" "$tag" \
              --title "$title" \
              --notes "$notes"
          else
            gh release create --repo "$repo" "$tag" \
              "${assets[@]}" \
              --target "$sha" \
              "${release_flags[@]}" \
              --title "$title" \
              --notes "$notes"
          fi
